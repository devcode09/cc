<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matches | Campus Cupid</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/animations.css"><link rel="stylesheet" href="css/responsive.css">
</head><body>
<div id="toast-container"></div>
<header class="site-header" id="site-header"></header>

<div class="container page-enter" style="padding-top:36px;">
  <div class="tab-strip">
    <button data-t="matches" class="active">💜 Matches</button>
    <button data-t="likes">💌 Likes You</button>
    <button data-t="crush">🕵️ Secret Crush</button>
    <button data-t="mystery">🔮 Mystery Match</button>
  </div>
  <div id="matchesContent" class="explore-grid"></div>
</div>

<nav class="mobile-nav" id="mobile-nav"></nav>
<script src="js/mock-data.js"></script>
<script src="js/matching.js"></script>
<script src="js/app.js"></script>
<script>
CC.init('matches.html');
const me=CC.currentUser();
const pool=getOtherStudents(me.id);
const matches=pool.slice(0,5), likesYou=pool.slice(5,8), mystery=pool.slice(8,10);

function card(s,extra){
  return `<div class="explore-card glass fade-in">
    <div class="thumb"><div class="avatar avatar-lg" style="background:${s.avatarBg}">${s.initials}</div></div>
    <div class="body"><h4>${s.name}</h4><div class="sub">Y${s.year} · ${s.branch}</div>${extra}</div>
  </div>`;
}

function render(tab){
  const el=document.getElementById('matchesContent');
  if(tab==='matches'){
    el.innerHTML = matches.map(s=>`<a href="messages.html?with=${s.id}">${card(s,`<button class="btn btn-primary btn-sm" style="width:100%;margin-top:6px;">Message</button>`)}</a>`).join('');
  } else if(tab==='likes'){
    el.innerHTML = likesYou.map(s=>`${card(s,`<button class="btn btn-outline btn-sm" style="width:100%;margin-top:6px;" onclick="event.preventDefault();showMatchAnimation(me,getStudentById('${s.id}'))">Like Back 💜</button>`)}`).join('')
      || `<div class="empty-state" style="grid-column:1/-1"><div class="em">💌</div>No likes yet — keep discovering!</div>`;
  } else if(tab==='crush'){
    el.innerHTML = `<div class="glass" style="grid-column:1/-1;padding:30px;">
      <p class="text-muted" style="margin-bottom:16px;">Secretly add someone to your crush list. They won't be notified unless it's mutual. 🤫</p>
      <div class="tag-cloud">${pool.slice(0,6).map(s=>`<span class="tag" data-id="${s.id}" onclick="toggleCrush(this)">${s.name}</span>`).join('')}</div>
    </div>`;
  } else if(tab==='mystery'){
    el.innerHTML = mystery.map(s=>`<div class="explore-card glass fade-in">
      <div class="thumb" style="filter:blur(14px);"><div class="avatar avatar-lg" style="background:${s.avatarBg}">${s.initials}</div></div>
      <div class="body"><h4>Anonymous Match 🔮</h4><div class="sub">Y${s.year} · ${s.branch} · ${computeCompatibility(me,s).percent}% compatible</div>
      <a href="messages.html?with=${s.id}"><button class="btn btn-primary btn-sm" style="width:100%;margin-top:6px;">Start Anonymous Chat</button></a></div></div>`).join('');
  }
}
function toggleCrush(el){
  el.classList.toggle('active');
  if(el.classList.contains('active') && Math.random()>0.5){
    setTimeout(()=>showMatchAnimation(me, getStudentById(el.dataset.id)),300);
    CC.toast("It's a mutual Secret Crush! 💜",'success');
  } else CC.toast('Added to Secret Crush list 🤫');
}
document.querySelectorAll('.tab-strip button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tab-strip button').forEach(x=>x.classList.remove('active'));b.classList.add('active');render(b.dataset.t);
});
render('matches');
</script>
</body></html>
