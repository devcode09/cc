<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Group Match | Campus Cupid</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/animations.css"><link rel="stylesheet" href="css/responsive.css">
</head><body>
<div id="toast-container"></div>
<header class="site-header" id="site-header"></header>

<div class="container page-enter" style="padding-top:40px;text-align:center;">
  <span class="eyebrow">👥 Group Match</span>
  <h2 style="margin:10px 0 8px;">3 Friends ↔ 3 Friends</h2>
  <p class="text-muted" style="max-width:520px;margin:0 auto 40px;">Squad up for a cafe hangout, gaming session, or group study — matched with another campus squad.</p>

  <div class="glass" style="max-width:560px;margin:0 auto;padding:34px;text-align:left;">
    <div class="form-group"><label>Squad Name</label><input class="form-control" placeholder="e.g. The Debuggers"></div>
    <div class="form-group"><label>Activity</label>
      <select class="form-control"><option>☕ Cafe Hangout</option><option>🎮 Gaming</option><option>🏸 Sports</option><option>📚 Group Study</option><option>🗺️ Campus Exploration</option></select>
    </div>
    <div class="form-group"><label>Add Your Squad (2 more friends)</label>
      <div class="tag-cloud" id="squadPicker"></div>
    </div>
    <button class="btn btn-primary" style="width:100%;" onclick="CC.toast('👥 Squad request sent! Looking for a matching group...','success')">Find Matching Squad</button>
  </div>
</div>

<nav class="mobile-nav" id="mobile-nav"></nav>
<script src="js/mock-data.js"></script>
<script src="js/matching.js"></script>
<script src="js/app.js"></script>
<script>
CC.init('groups.html');
const me=CC.currentUser();
document.getElementById('squadPicker').innerHTML = getOtherStudents(me.id).slice(0,6).map(s=>`<span class="tag" data-id="${s.id}">${s.name}</span>`).join('');
document.querySelectorAll('#squadPicker .tag').forEach(t=>t.onclick=()=>t.classList.toggle('active'));
</script>
</body></html>
