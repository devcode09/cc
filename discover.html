<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Discover | Campus Cupid</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/animations.css"><link rel="stylesheet" href="css/responsive.css">
</head><body>
<div id="toast-container"></div>
<header class="site-header" id="site-header"></header>

<div class="container page-enter" style="padding-top:36px;">
  <div class="mode-switch">
    <button data-mode="Dating" class="active">❤️ Dating</button>
    <button data-mode="Friendship">🤝 BFF</button>
    <button data-mode="Study Buddy">📚 Study Buddy</button>
    <button class="btn-ghost" style="border-radius:100px;padding:10px 20px;" onclick="CC.openSheet('filterSheet')">⚙️ Filters</button>
  </div>

  <div class="deck-wrap" id="deckWrap"></div>

  <div class="deck-actions">
    <button class="rewind" id="btnRewind" title="Rewind">↺</button>
    <button class="pass" id="btnPass" title="Pass">✕</button>
    <button class="superlike" id="btnSuper" title="Super Like">⭐</button>
    <button class="like" id="btnLike" title="Like">💜</button>
  </div>
</div>

<!-- Filter Bottom Sheet -->
<div class="sheet-overlay" id="filterSheet-overlay" onclick="CC.closeSheet('filterSheet')"></div>
<div class="sheet glass-strong" id="filterSheet">
  <div class="sheet-handle"></div>
  <h3 style="margin-bottom:18px;">Discovery Filters</h3>
  <div class="form-group">
    <label>Year Matching Mode</label>
    <select class="form-control" id="yearModeSelect">
      <option value="strict">Strict — Same Year Only</option>
      <option value="flexible" selected>Flexible — Same ± 1 Year</option>
      <option value="all">All Campus</option>
    </select>
  </div>
  <div class="form-group"><label>Campus</label>
    <select class="form-control"><option>Any</option><option>Bidholi</option><option>Kandoli</option></select>
  </div>
  <div class="form-group"><label>Interests</label>
    <div class="tag-cloud">${['Coding','Music','Gym','Travel','Gaming','Cricket'].map ? '' : ''}</div>
  </div>
  <button class="btn btn-primary" style="width:100%;" data-close-sheet="filterSheet">Apply Filters</button>
</div>

<nav class="mobile-nav" id="mobile-nav"></nav>

<script src="js/mock-data.js"></script>
<script src="js/matching.js"></script>
<script src="js/app.js"></script>
<script src="js/discovery.js"></script>
<script>
  CC.init('discover.html');
  const urlMode = new URLSearchParams(location.search).get('mode');
  if(urlMode) Discovery.mode = urlMode;
  Discovery.init();
  document.querySelectorAll('.mode-switch button[data-mode]').forEach(b=>{
    if(b.dataset.mode===Discovery.mode){document.querySelectorAll('.mode-switch button').forEach(x=>x.classList.remove('active'));b.classList.add('active');}
  });
</script>
</body></html>
